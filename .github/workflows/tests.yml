name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite is deliberately offline: the model's mathematics, the
      # point-in-time joins and the validation machinery are all tested
      # against synthetic inputs with known answers, so CI never depends on
      # a third-party endpoint being up.
      - name: Test
        run: pytest -q

      - name: Check the packaged cross-section still runs
        run: python -m merton.cli crosssection
